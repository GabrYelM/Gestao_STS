{% extends "base.html" %}
{% block title %}Produção{% endblock %}

{% block content %}
<style>
.vertical-text {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    white-space: nowrap;
    padding: 5px;
    font-weight: bold;
}
</style>

<div class="container-fluid mt-5" style="padding-left: 3%; padding-right: 3%;">
    <h2>Painel de Produção</h2>
    <hr>
    
    <!-- O FORMULÁRIO DE SELEÇÃO -->
    <form method="POST" action="/producao" class="row g-3 mb-4">
        
        <!-- Escolha do Relatório -->
        <div class="col-md-4">
            <label class="form-label">Qual Relatório de Produção deseja visualizar?</label>
            <select class="form-select" name="indice_relatorio">
                <option value="03" {% if relatorio_selecionado == '03' %}selected{% endif %}>Relatório 03 - PLANILHA DE PRODUÇÃO POR ESPECIALIDADE (SIGA)</option>
                <option value="04" {% if relatorio_selecionado == '04' %}selected{% endif %}>Relatório 04 - VAGAS OFERTADAS POR TIPO DE ATENDIMENTO DA AGENDA POR UNIDADE</option>
                <option value="08" {% if relatorio_selecionado == '08' %}selected{% endif %}>Relatório 08 - PLANILHA DE ACOMPANHAMENTO DE GESTANTES</option>
                <option value="10" {% if relatorio_selecionado == '10' %}selected{% endif %}>Relatório 10 - ATENDIMENTO POR PROCEDIMENTO SEGUNDO SEXO E FAIXA ETÁRIA</option>
                <option value="11" {% if relatorio_selecionado == '11' %}selected{% endif %}>Relatório 11 - FLUXO DE ENTRADA SAÍDA E ATIVOS DE PROCEDIMENTOS E ESPECIALIDADES</option>
                <option value="13" {% if relatorio_selecionado == '13' %}selected{% endif %}>Relatório 13 - PERDA PRIMÁRIA POR PROCEDIMENTO E ESPECIALIDADE</option>
                <option value="14" {% if relatorio_selecionado == '14' %}selected{% endif %}>Relatório 14 - PERDA SECUNDÁRIA POR EXECUTANTE</option>
                <!-- Pode adicionar os outros aqui -->
            </select>
        </div>

        <!-- Escolha do Período -->
        <div class="col-md-4">
            <label class="form-label">Período (Ex: 202601)</label>
            <input type="text" class="form-control" name="periodo" value="{{ periodo_selecionado | default('202601') }}">
        </div>

        <div class="col-md-4 d-flex align-items-end">
            <button type="submit" id="btn-gerar-dash" class="btn btn-primary w-100">
                <span id="spinner-dash" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                <span id="texto-botao">Visualizar Produção</span>
            </button>
        </div>
    </form>

    <!-- A TABELA SÓ APARECE SE O PYTHON MANDAR A VARIÁVEL tabela_html -->
    {% if tabela_html %}
        <div class="card shadow-sm p-3">
            <h4>Resultado:</h4>
            <div class="table-responsive">
                {{ tabela_html | safe }}
            </div>
        </div>
    {% endif %}

</div>
{% endblock %}

{% block scripts %}
<!-- Estilos do DataTables -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">

<!-- Scripts do DataTables -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<!-- Scripts para Botões e Exportação -->
<script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>

<script>
    const formDash = document.querySelector('form');
    if (formDash) {
        formDash.addEventListener('submit', function() {
            document.getElementById('spinner-dash').classList.remove('d-none');
            document.getElementById('texto-botao').innerText = ' Processando...';
            document.getElementById('btn-gerar-dash').classList.add('disabled');
        });
    }

    $(document).ready(function() {
        if ($('.table').length) {
            $('.table').DataTable({
                "language": {
                    "url": "//cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json"
                },
                "pageLength": 100, // Quantidade inicial
                "lengthMenu": [10, 50, 100, 500, 1000], // Opções de quantidade
                "dom": '<"row mb-3 align-items-center"<"col-sm-12 col-md-4"l><"col-sm-12 col-md-4 text-center"B><"col-sm-12 col-md-4"f>>' +
                       'rt' +
                       '<"row mt-3"<"col-sm-12 col-md-5"i><"col-sm-12 col-md-7"p>>',
                "buttons": [
                    {
                        extend: 'excelHtml5',
                        text: '<i class="bi bi-file-earmark-excel"></i> Exportar para Excel',
                        className: 'btn btn-success'
                    }
                ],
                initComplete: function () {
                    this.api().columns().every(function () {
                        var column = this;
                        
                        // Cria o dropdown de filtro no cabeçalho da coluna
                        var select = $('<select class="form-select form-select-sm mt-2" style="font-weight: normal; min-width: 80px;"><option value="">Todos</option></select>')
                            .appendTo($(column.header()))
                            .on('change', function () {
                                var val = $.fn.dataTable.util.escapeRegex($(this).val());
                                // Filtra exatamente pela string escolhida
                                column.search(val ? '^' + val + '$' : '', true, false).draw();
                            })
                            .on('click', function(e) {
                                // Impede que o clique no filtro acione a ordenação da coluna
                                e.stopPropagation();
                            });
                        
                        // Povoa o dropdown com os valores únicos daquela coluna
                        column.data().unique().sort().each(function (d, j) {
                            var text = $('<div>').html(d).text(); // Limpa formatações HTML caso existam
                            if (text && text.trim() !== '') {
                                select.append('<option value="' + text + '">' + text + '</option>');
                            }
                        });
                    });
                }
            });
        }
    });
</script>
{% endblock %}
