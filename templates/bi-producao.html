{% extends "base.html" %}

{% block title %}Gerar Relatórios{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h3 text-primary mb-3">Gerar Relatórios</h1>
                    <p class="text-muted">Inicie a extração automatizada dos dados de produção para o período selecionado.</p>

                    <div id="container-datas">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="mes-inicio" class="form-label fw-semibold">Mês de Início</label>
                                <select id="mes-inicio" class="form-select">
                                    <option value="Janeiro">Janeiro</option>
                                    <option value="Fevereiro">Fevereiro</option>
                                    <option value="Março">Março</option>
                                    <option value="Abril">Abril</option>
                                    <option value="Maio">Maio</option>
                                    <option value="Junho">Junho</option>
                                    <option value="Julho">Julho</option>
                                    <option value="Agosto">Agosto</option>
                                    <option value="Setembro">Setembro</option>
                                    <option value="Outubro">Outubro</option>
                                    <option value="Novembro">Novembro</option>
                                    <option value="Dezembro">Dezembro</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="ano-inicio" class="form-label fw-semibold">Ano de Início</label>
                                <input type="number" id="ano-inicio" class="form-control" value="2026">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="mes-fim" class="form-label fw-semibold">Mês de Fim</label>
                                <select id="mes-fim" class="form-select">
                                    <option value="Janeiro">Janeiro</option>
                                    <option value="Fevereiro">Fevereiro</option>
                                    <option value="Março">Março</option>
                                    <option value="Abril">Abril</option>
                                    <option value="Maio">Maio</option>
                                    <option value="Junho">Junho</option>
                                    <option value="Julho">Julho</option>
                                    <option value="Agosto">Agosto</option>
                                    <option value="Setembro">Setembro</option>
                                    <option value="Outubro">Outubro</option>
                                    <option value="Novembro">Novembro</option>
                                    <option value="Dezembro">Dezembro</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="ano-fim" class="form-label fw-semibold">Ano de Fim</label>
                                <input type="number" id="ano-fim" class="form-control" value="2026">
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="relatorio-escolhido" class="form-label fw-semibold">Relatório a extrair (Download + ETL)</label>
                        <select id="relatorio-escolhido" class="form-select">
                            <option value="TODOS">TODOS (Processar Lote Completo)</option>
                            <option value="AG04">AG04 - Agenda e Atendimento</option>
                            <option value="AT02">AT02 - Produção Ambulatorial por Procedimento</option>
                            <option value="AT03">AT03 - Produção Ambulatorial por Faixa Etária</option>
                            <option value="FE02">FE02 - Fila de Espera</option>
                            <option value="VG02">VG02 - Vagas Ofertadas vs Agendamentos</option>
                            <option value="VG04">VG04 - Relação de Agendamentos</option>
                            <option value="CG01">CG01 - Acompanhamento de Gestantes</option>
                            <option value="CG05">CG05 - Consulta Gestantes e Vacinação</option>
                            <option value="CG06">CG06 - Lista Nominal (Exames)</option>
                            <option value="GAC02">GAC02 - Cadastro e Vínculos</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-start mt-4">
                        <button type="button" id="btn-gerar" class="btn btn-success">Gerar</button>
                        <a href="/" class="btn btn-outline-secondary">Voltar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const btnGerar = document.getElementById('btn-gerar');
    const mesInicio = document.getElementById('mes-inicio');
    const anoInicio = document.getElementById('ano-inicio');
    const mesFim = document.getElementById('mes-fim');
    const anoFim = document.getElementById('ano-fim');
    const relatorioEscolhido = document.getElementById('relatorio-escolhido');
    const containerDatas = document.getElementById('container-datas');

    if (relatorioEscolhido) {
        relatorioEscolhido.addEventListener('change', function() {
            if (this.value === 'GAC02') {
                containerDatas.style.display = 'none';
            } else {
                containerDatas.style.display = 'block';
            }
        });
    }

    if (btnGerar) {
        btnGerar.addEventListener('click', function (e) {
            e.preventDefault();

            btnGerar.innerHTML = '⏳ Processando...';
            btnGerar.classList.add('disabled');

            const formData = new URLSearchParams();
            formData.append('mes_inicio', mesInicio ? mesInicio.value : 'Janeiro');
            formData.append('ano_inicio', anoInicio ? anoInicio.value : '2026');
            formData.append('mes_fim', mesFim ? mesFim.value : 'Janeiro');
            formData.append('ano_fim', anoFim ? anoFim.value : '2026');
            formData.append('relatorio_escolhido', relatorioEscolhido ? relatorioEscolhido.value : 'TODOS');

            fetch('/gerar_relatorios', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                },
                body: formData.toString()
            })
                .then(response => response.json())
                .then(data => {
                    const radar = setInterval(() => {
                        fetch('/status_extracao')
                            .then(res => res.json())
                            .then(status => {
                                if (status.progresso) {
                                    btnGerar.innerHTML = '⏳ ' + status.progresso;
                                }
                                if (status.concluido) {
                                    clearInterval(radar);
                                    alert("Extratores e ETL concluídos com sucesso! Dados prontos no banco.");
                                    btnGerar.innerHTML = 'Gerar';
                                    btnGerar.classList.remove('disabled');
                                }
                            });
                    }, 3000);
                })
                .catch(error => {
                    alert('Ocorreu um erro ao tentar iniciar os relatórios.');
                    console.error(error);
                    btnGerar.innerHTML = 'Gerar';
                    btnGerar.classList.remove('disabled');
                });
        });
    }
</script>
{% endblock %}
