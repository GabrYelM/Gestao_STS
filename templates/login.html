{% extends "base.html" %}

{% block title %}Login - Gestão STS{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 75vh;">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-4 mt-5">
                <div class="card-body p-5">
                    
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 bg-primary-subtle text-primary rounded-circle mb-2">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-primary mb-1">Acesso Administrativo</h3>
                        <p class="text-muted small">Faça login para atualizar fontes, gerenciar cadastros e executar robôs.</p>
                    </div>

                    <form method="POST" action="">
                        <input type="hidden" name="next" value="{{ next }}">
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Usuário</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control form-control-lg bg-light border-0" id="username" name="username" placeholder="Usuário admin" required autofocus>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Senha</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control form-control-lg bg-light border-0" id="password" name="password" placeholder="Senha" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Entrar como Administrador
                        </button>

                        <div class="text-center">
                            <a href="/producao" class="text-decoration-none text-muted small">
                                <i class="bi bi-arrow-left me-1"></i> Voltar para os Relatórios de Produção (Acesso Livre)
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
